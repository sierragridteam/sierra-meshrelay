name: release

# Pushing a v* tag builds meshbridge for every target and publishes a GitHub
# release with the archives, SHA256SUMS and its signature (SHA256SUMS.sig).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build archives
        run: sh scripts/dist.sh "$GITHUB_REF_NAME"
      - name: Sign (for bridges' auto-update)
        env:
          MESHBRIDGE_RELEASE_SIGNING_KEY: ${{ secrets.MESHBRIDGE_RELEASE_SIGNING_KEY }}
        run: go run ./cmd/signrelease "$GITHUB_REF_NAME" dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
