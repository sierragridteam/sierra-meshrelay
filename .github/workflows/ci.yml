name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test (unit, relay, and local end-to-end)
        run: make test
      - name: Cross-compile the bridge for every release target
        run: make cross

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit and local end-to-end)
        run: go test ./...
      - name: Install script and Windows service, end to end
        env:
          MESHBRIDGE_WINDOWS_SERVICE_TEST: "1"
        run: go test -count=1 -v -run Windows ./e2e/
